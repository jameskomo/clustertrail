apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backups.demo.clustertrail.dev
spec:
  group: demo.clustertrail.dev
  scope: Namespaced
  names: { plural: backups, singular: backup, kind: Backup }
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - { name: Target, type: string, jsonPath: .spec.target }
        - { name: Schedule, type: string, jsonPath: .spec.schedule }
        - { name: Phase, type: string, jsonPath: .status.phase }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                target: { type: string }
                schedule: { type: string }
            status:
              type: object
              properties:
                phase: { type: string }
---
apiVersion: demo.clustertrail.dev/v1
kind: Backup
metadata: { name: nightly-postgres, namespace: shop }
spec: { target: postgres, schedule: "0 2 * * *" }
---
apiVersion: demo.clustertrail.dev/v1
kind: Backup
metadata: { name: hourly-uploads, namespace: shop }
spec: { target: uploads, schedule: "0 * * * *" }
