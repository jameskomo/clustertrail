# Demo workloads for the local kind cluster: enough variety to exercise every
# status the pods table renders. Nothing here is production-like on purpose.
apiVersion: v1
kind: Namespace
metadata: { name: shop }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: checkout, namespace: shop }
spec:
  replicas: 4
  selector: { matchLabels: { app: checkout } }
  template:
    metadata: { labels: { app: checkout } }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80, name: http }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 128Mi }
          env:
            - name: LOG_LEVEL
              valueFrom: { configMapKeyRef: { name: checkout-settings, key: LOG_LEVEL } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: checkout-credentials, key: DB_PASSWORD } }
            - name: API_TOKEN
              valueFrom: { secretKeyRef: { name: checkout-credentials, key: API_TOKEN } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: SERVICE_NAME
              value: checkout
          volumeMounts:
            - { name: config, mountPath: /etc/app/config, readOnly: true }
            - { name: creds, mountPath: /var/run/secrets/app, readOnly: true }
          livenessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 5 }
      volumes:
        - name: config
          configMap: { name: checkout-settings }
        - name: creds
          secret: { secretName: checkout-credentials }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog, namespace: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: catalog } }
  template:
    metadata: { labels: { app: catalog } }
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
        - name: sidecar
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 30; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payments, namespace: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: payments } }
  template:
    metadata: { labels: { app: payments } }
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo boom; exit 1"]   # CrashLoopBackOff on purpose
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: search, namespace: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: search } }
  template:
    metadata: { labels: { app: search } }
    spec:
      containers:
        - name: idx
          image: ghcr.io/does-not-exist/search:latest   # ImagePullBackOff on purpose
---
apiVersion: batch/v1
kind: Job
metadata: { name: nightly-report, namespace: shop }
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: report
          image: busybox:1.36
          command: ["sh", "-c", "echo done"]              # Completed
