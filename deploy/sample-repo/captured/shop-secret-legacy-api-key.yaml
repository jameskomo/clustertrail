# ClusterTrail removed this Secret's values. The keys are kept so the
# shape is reviewable; the values were not written, because a repository
# is not a secret store and base64 is not encryption.
#
# Fill them from your secret manager, or replace this file with a
# SealedSecret, an ExternalSecret, or a SOPS-encrypted file.
apiVersion: v1
kind: Secret
metadata:
  name: legacy-api-key
  namespace: shop
stringData:
  LEGACY_KEY: REPLACE_ME
type: Opaque
